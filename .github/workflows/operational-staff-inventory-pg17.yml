name: Operational staff approval + inventory — disposable PostgreSQL17
on:
  pull_request:
    paths:
      - '.github/workflows/operational-staff-inventory-pg17.yml'
      - 'supabase/migrations/20261121201000_staff_self_service_approval_accountant.sql'
      - 'supabase/migrations/20261121202000_inventory_transactional_branch_ops.sql'
      - 'supabase/tests/operational_staff_inventory_pg17.sql'
      - 'scripts/ci/operational_source_guard.sh'
      - 'docs/STAFF_INVENTORY_OPERATIONAL_CONTRACT.md'
      - 'web/src/lib/operational-rpcs.ts'
permissions:
  contents: read
jobs:
  operations-pg17:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: operational-ci-only
          POSTGRES_DB: clinical16_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d clinical16_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: operational-ci-only
      PGDATABASE: clinical16_ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Frozen PR124 and strict operational child source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor ebe6caf8a1f9f17fb00739986b1ebdb83e2d9d0d HEAD
          bash scripts/ci/rc0_source_guard.sh
      - name: Install PostgreSQL17 client
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Apply synthetic 11 + 12–15 + 16 and execute real PG17 security
        shell: bash
        run: |
          set -euo pipefail
          pg(){ psql -X -v ON_ERROR_STOP=1 -q -f "$1"; }
          pg supabase/tests/phase5a_staff_pg17_bootstrap.sql
          pg supabase/tests/phase4_combined_provider_upgrade.sql
          for file in \
            20261113070302_phase2_core_data_security.sql \
            20261113070834_phase2_index_and_policy_tuning.sql \
            20261113074938_phase2_verified_auth_and_staff_bootstrap.sql \
            20261113095318_phase3_appointment_lifecycle.sql \
            20261113100958_phase3_clinical_storage_policies.sql \
            20261113101626_phase3_staff_membership_audit.sql \
            20261113211600_phase4_taxonomy_attachments.sql \
            20261113211700_phase4_animal_catalog_seed.sql \
            20261114072200_phase4_taxonomy_trigger_chow_chow_guard.sql \
            20261114090000_phase4_public_booking_contract.sql \
            20261116002500_phase3_storage_outer_object_path_rls_fix.sql; do
              pg "supabase/migrations/$file"
          done
          pg supabase/tests/phase3_storage_outer_path_synthetic_records.sql
          psql -X -v ON_ERROR_STOP=1 -q <<'PRE12'
          create table clinic_ci.issue77_original_pets as select id,to_jsonb(p) old_row from public.pets p;
          create table clinic_ci.issue77_original_appointments as select id,to_jsonb(a) old_row from public.appointments a;
          -- Do not disturb the inherited Issue77 test's exact two-record fixture.
          PRE12
          pg supabase/migrations/20261117233500_issue77_four_branch_foundation.sql
          pg supabase/tests/issue77_four_branch_pg17_denials.sql
          # Synthetic-only recreation of a pre-branch historical NULL record.
          # SUPERUSER CI temporarily bypasses only the insert branch guard;
          # re-enable it immediately. Never used in an applied migration.
          psql -X -v ON_ERROR_STOP=1 -q <<'LEGACY_UNKNOWN'
          alter table public.clinical_records disable trigger clinical_branch_guard;
          insert into public.clinical_records(pet_id,branch_id,procedure,authored_by)
          values('33333333-3333-4333-8333-333333333333',
           null,'CLINICAL16 old unknown branch record',
           'dddddddd-dddd-4ddd-8ddd-dddddddddddd');
          alter table public.clinical_records enable trigger clinical_branch_guard;
          LEGACY_UNKNOWN
          pg supabase/tests/issue58_staff_branch_queue_fixture.sql
          pg supabase/migrations/20261118203500_issue51_branch_booking_security.sql
          pg supabase/migrations/20261118215500_issue58_staff_branch_read_contract.sql
          pg supabase/migrations/20261118225000_issue78_inventory_read_only_foundation.sql
          pg supabase/migrations/20261120160000_clinical_chart_encounter_drafts.sql
          pg supabase/tests/clinical_chart_encounter_pg17.sql
          pg supabase/migrations/20261120221000_clinical_provenance_pagination_security.sql
          pg supabase/tests/clinical_provenance_pagination_pg17.sql
          echo 'PASS: isolated PG17 clinical #16 + #17 provenance, immutable draft cursor, cross-vet audit, RLS and history'

      - name: Apply additive #18/#19 with live-session SQL shim and test
        shell: bash
        run: |
          set -euo pipefail
          # The real Supabase provider owns auth.sessions. Only disposable CI
          # uses this tiny representation for SQL/JWT session revocation tests.
          psql -X -q -v ON_ERROR_STOP=1 <<'SESSION'
          create table auth.sessions (
           id uuid primary key,
           user_id uuid not null references auth.users(id) on delete cascade
          );
          SESSION
          for migration in \
            supabase/migrations/20261121201000_staff_self_service_approval_accountant.sql \
            supabase/migrations/20261121202000_inventory_transactional_branch_ops.sql;do
            psql -X -q -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -X -q -v ON_ERROR_STOP=1 -f supabase/tests/operational_staff_inventory_pg17.sql
          echo 'PASS: actual PG17 verified staff approval/accountant and transactional inventory API security'
      - name: Independent sessions, concurrent receives and stock conservation
        shell: bash
        run: |
          set -euo pipefail
          item="$(psql -XAt -v ON_ERROR_STOP=1 -c "select id from public.medicine_catalog where product_code='OPS-SUP-001'")"
          test -n "$item"
          actor(){
            local nonce="$1" quantity="$2"
            psql -XAt -v ON_ERROR_STOP=1 <<SQL
          set role authenticated;
          set request.jwt.claim.sub='cccccccc-cccc-4ccc-8ccc-cccccccccccc';
          set request.jwt.claims='{"role":"authenticated","is_anonymous":false,"exp":4102444800,"session_id":"c3333333-aaaa-4aaa-8aaa-333333333333"}';
          select public.receive_branch_inventory_stock(
           '22222222-0000-4000-8000-000000000077','$item',
           '$nonce','LOT-OPS-1',date '2028-12-31','Synthetic Supplier',$quantity);
          SQL
          }
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          actor 'f5555555-2222-4222-8222-555555555555' 3 >"$tmp/a" 2>&1 & a=$!
          actor 'f6666666-2222-4222-8222-666666666666' 4 >"$tmp/b" 2>&1 & b=$!
          wait "$a"; wait "$b"
          grep -q '"kind": "stock_received"' "$tmp/a"
          grep -q '"kind": "stock_received"' "$tmp/b"
          test "$(psql -XAt -c "select on_hand_units from public.branch_stock_batches where medicine_id='$item'")" = 22
          test "$(psql -XAt -c "select sum(delta_on_hand) from public.stock_movements where medicine_id='$item'")" = 22
          # Concurrent identical nonce/payload: serialized idempotent replay.
          actor 'f7777777-2222-4222-8222-777777777777' 5 >"$tmp/c" 2>&1 & c=$!
          actor 'f7777777-2222-4222-8222-777777777777' 5 >"$tmp/d" 2>&1 & d=$!
          wait "$c"; wait "$d"
          cmp "$tmp/c" "$tmp/d"
          test "$(psql -XAt -c "select on_hand_units from public.branch_stock_batches where medicine_id='$item'")" = 27
          test "$(psql -XAt -c "select count(*) from public.stock_movements where event_id='f7777777-2222-4222-8222-777777777777'")" = 1
          test "$(psql -XAt -c "select sum(delta_on_hand) from public.stock_movements where medicine_id='$item'")" = 27
          # An actual deleted Auth session must not retain operational rights.
          psql -X -q -v ON_ERROR_STOP=1 <<'REVOKED'
          begin;
          delete from auth.sessions where id='c3333333-aaaa-4aaa-8aaa-333333333333';
          set local role authenticated;
          set local request.jwt.claim.sub='cccccccc-cccc-4ccc-8ccc-cccccccccccc';
          set local request.jwt.claims='{"role":"authenticated","is_anonymous":false,"exp":4102444800,"session_id":"c3333333-aaaa-4aaa-8aaa-333333333333"}';
          do $verify$
          begin
           begin
            perform public.receive_branch_inventory_stock(
             '22222222-0000-4000-8000-000000000077',
             (select id from public.medicine_catalog where product_code='OPS-SUP-001'),
             gen_random_uuid(),'LOT-OPS-1',date '2028-12-31','Synthetic Supplier',1);
            raise exception 'OPS_FAIL: revoked JWT session accepted';
           exception when insufficient_privilege then null;end;
          end $verify$;
          rollback;
          REVOKED
          echo 'PASS: concurrent stock conservation, one receipt per nonce and deleted-session denial'
