name: Legacy PHP static checks

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP version
        run: php --version
      - name: Lint PHP source, migrations, routes and tests
        run: |
          find app database routes tests -type f -name '*.php' -print0 | xargs -0 -n 1 php -l
