name: Phase 3 recovery scripts

on:
  pull_request:
    paths:
      - 'scripts/recovery/**'
      - '.github/workflows/phase3-recovery.yml'
      - 'supabase/checks/phase4_postflight_readonly.sql'
      - 'supabase/tests/phase4_postflight_privileges.sh'
      - 'docs/PHASE4_SUPERVISOR_ROLLOUT_REVIEW.md'
  push:
    branches: [master]
    paths:
      - 'scripts/recovery/**'
      - '.github/workflows/phase3-recovery.yml'
      - 'supabase/checks/phase4_postflight_readonly.sql'
      - 'supabase/tests/phase4_postflight_privileges.sh'
      - 'docs/PHASE4_SUPERVISOR_ROLLOUT_REVIEW.md'

permissions:
  contents: read

jobs:
  recovery-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Bash syntax and mock offline backup/verification
        run: node --test scripts/recovery/tests/*.test.mjs

  isolated-postgres-drill:
    # Synthetic-only PostgreSQL instance. Does NOT connect to hosted Supabase.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dawney-ci-only
          POSTGRES_DB: clinic_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clinic_source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Real encrypted dump and isolated restore of synthetic PostgreSQL 17 records
        run: bash scripts/recovery/tests/isolated-restore.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore signed five-component Auth / application / Storage set
        run: |
          bash -n scripts/recovery/tests/synthetic-full-set-restore.sh
          bash scripts/recovery/tests/synthetic-full-set-restore.sh

      - name: Pin PR62 plus exact Phase4 heads and extract reviewed migration blobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/recovery-phase4-pinned"
          git fetch --no-tags --depth=1 origin \
            'refs/pull/52/head:refs/remotes/origin/recovery-pr52'
          test "$(git rev-parse refs/remotes/origin/recovery-pr52)" = \
            '5272cadbef4cc966e1b650905c5680b8fdf56c99'
          git fetch --no-tags --depth=1 origin \
            'refs/pull/40/head:refs/remotes/origin/recovery-pr40'
          test "$(git rev-parse refs/remotes/origin/recovery-pr40)" = \
            '7f6b7b4b12c6d5c04a049f5427b77704d560e4f0'
          git fetch --no-tags --depth=1 origin \
            'refs/pull/43/head:refs/remotes/origin/recovery-pr43'
          test "$(git rev-parse refs/remotes/origin/recovery-pr43)" = \
            '2749f810a2d5195e974949cb8e23d4495a8b0d11'
          git fetch --no-tags --depth=1 origin \
            'refs/pull/62/head:refs/remotes/origin/recovery-pr62'
          test "$(git rev-parse refs/remotes/origin/recovery-pr62)" = \
            '76009db7dcd3274382444c2f553d75fd7ee85a74'
          git show 'refs/remotes/origin/recovery-pr52:supabase/migrations/20261113211600_phase4_taxonomy_attachments.sql' \
            > "$RUNNER_TEMP/recovery-phase4-pinned/20261113211600_phase4_taxonomy_attachments.sql"
          git show 'refs/remotes/origin/recovery-pr52:supabase/migrations/20261113211700_phase4_animal_catalog_seed.sql' \
            > "$RUNNER_TEMP/recovery-phase4-pinned/20261113211700_phase4_animal_catalog_seed.sql"
          git show 'refs/remotes/origin/recovery-pr40:supabase/migrations/20261114072200_phase4_taxonomy_trigger_chow_chow_guard.sql' \
            > "$RUNNER_TEMP/recovery-phase4-pinned/20261114072200_phase4_taxonomy_trigger_chow_chow_guard.sql"
          git show 'refs/remotes/origin/recovery-pr43:supabase/migrations/20261114090000_phase4_public_booking_contract.sql' \
            > "$RUNNER_TEMP/recovery-phase4-pinned/20261114090000_phase4_public_booking_contract.sql"
          test "$(git show refs/remotes/origin/recovery-pr52:.github/workflows/phase4-four-migration-chain.yml | grep -Fc '2749f810a2d5195e974949cb8e23d4495a8b0d11')" = 1
      - name: Verify recovered synthetic set cannot silently bypass Phase3 schema preflight
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
        run: |
          set -euo pipefail
          bash -n scripts/recovery/tests/phase4-restored-compatibility.sh
          bash scripts/recovery/tests/phase4-restored-compatibility.sh \
            "$RUNNER_TEMP/recovery-phase4-pinned"

  postflight-column-grants-pg17:
    # Synthetic isolated PostgreSQL 17; metadata privilege checks are not RLS certification.
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-privilege-ci-only
          POSTGRES_DB: postflight_privilege_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postflight_privilege_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: isolated-privilege-ci-only
      PGDATABASE: postflight_privilege_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Confirm postflight rejects unexpected column-only grants and distinguish RLS
        run: |
          bash -n supabase/tests/phase4_postflight_privileges.sh
          bash supabase/tests/phase4_postflight_privileges.sh

  full-phase3-signed-recovery-to-phase4-pg17:
    # Independent positive rehearsal; preserves existing minimal negative tests.
    runs-on: ubuntu-latest
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dawney-phase3-ci-only
          POSTGRES_DB: phase3_source_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d phase3_source_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail closed on reviewed PR62, PR40, PR43 and PR52 source-head drift
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/positive-recovery-pinned"
          git fetch --no-tags --depth=1 origin \
            'refs/pull/52/head:refs/remotes/origin/positive-pr52'
          test "$(git rev-parse refs/remotes/origin/positive-pr52)" = \
            '5272cadbef4cc966e1b650905c5680b8fdf56c99'
          git fetch --no-tags --depth=1 origin \
            'refs/pull/40/head:refs/remotes/origin/positive-pr40'
          test "$(git rev-parse refs/remotes/origin/positive-pr40)" = \
            '7f6b7b4b12c6d5c04a049f5427b77704d560e4f0'
          git fetch --no-tags --depth=1 origin \
            'refs/pull/43/head:refs/remotes/origin/positive-pr43'
          test "$(git rev-parse refs/remotes/origin/positive-pr43)" = \
            '2749f810a2d5195e974949cb8e23d4495a8b0d11'
          git fetch --no-tags --depth=1 origin \
            'refs/pull/62/head:refs/remotes/origin/positive-pr62'
          test "$(git rev-parse refs/remotes/origin/positive-pr62)" = \
            '76009db7dcd3274382444c2f553d75fd7ee85a74'
          git show 'refs/remotes/origin/positive-pr62:supabase/migrations/20261116002500_phase3_storage_outer_object_path_rls_fix.sql' \
            > "$RUNNER_TEMP/positive-recovery-pinned/20261116002500_phase3_storage_outer_object_path_rls_fix.sql"
          git show 'refs/remotes/origin/positive-pr52:supabase/migrations/20261113211600_phase4_taxonomy_attachments.sql' \
            > "$RUNNER_TEMP/positive-recovery-pinned/20261113211600_phase4_taxonomy_attachments.sql"
          git show 'refs/remotes/origin/positive-pr52:supabase/migrations/20261113211700_phase4_animal_catalog_seed.sql' \
            > "$RUNNER_TEMP/positive-recovery-pinned/20261113211700_phase4_animal_catalog_seed.sql"
          git show 'refs/remotes/origin/positive-pr40:supabase/migrations/20261114072200_phase4_taxonomy_trigger_chow_chow_guard.sql' \
            > "$RUNNER_TEMP/positive-recovery-pinned/20261114072200_phase4_taxonomy_trigger_chow_chow_guard.sql"
          git show 'refs/remotes/origin/positive-pr43:supabase/migrations/20261114090000_phase4_public_booking_contract.sql' \
            > "$RUNNER_TEMP/positive-recovery-pinned/20261114090000_phase4_public_booking_contract.sql"
      - name: Restore real Phase3-shaped signed five-component set and apply exact Phase4
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/recovery/tests/synthetic-phase3-phase4-positive.sh
          bash scripts/recovery/tests/synthetic-phase3-phase4-positive.sh \
            "$RUNNER_TEMP/positive-recovery-pinned"
