name: Unified non-production release candidate PostgreSQL17 and browser gate

# Incremental candidate PR only; no manual hosted invocation.
on:
  pull_request:
    paths:
      - '.github/workflows/full-tree-pg17-security.yml'
      - 'scripts/ci/full_tree_pg17.sh'
      - 'supabase/tests/full_tree_approved_booking_gate.sql'
      - 'docs/UNIFIED_RELEASE_CANDIDATE.md'
      - 'docs/AI_HANDOFF.md'
      - 'web/src/pages/AppointmentsPage.tsx'
      - 'web/src/public-site/booking-mode.*'
      - 'web/src/public-site/usePatientEligibility.ts'
      - 'web/src/public-site/useServiceSpecies.ts'
      - 'web/tests/owner-booking-view.test.mjs'
      - 'docs/phase5a-ui/INTEGRATION.md'
      - 'web/src/ops/port-adapter.d.mts'
      - 'web/src/ops/port-adapter.mjs'
      - 'web/src/ops/port.ts'
      - 'web/src/ops/useOpsData.ts'
      - 'web/src/pages/staff/OpsPage.tsx'
      - 'web/tests/ops-model.test.mjs'
      - 'web/tests/ops-port.test.mjs'
      - '.github/workflows/hosted-security-acceptance-source.yml'
      - 'scripts/hosted-acceptance/**'
      - 'docs/HOSTED_SECURITY_ACCEPTANCE.md'
      - 'docs/STAGING_ACCEPTANCE_TRANSPORT_PREPARATION.md'
      - '.github/workflows/issue77-four-branch-pg17.yml'
      - 'supabase/migrations/20261117233500_issue77_four_branch_foundation.sql'
      - 'supabase/tests/issue77_four_branch_pg17_denials.sql'
      - 'docs/ISSUE77_FOUR_BRANCH_FOUNDATION.md'
      # Exact imported PR79 public website; PR81 branch selector changed/added paths.
      - 'web/index.html'
      - 'web/src/components/SiteLayout.tsx'
      - 'web/src/pages/public/AboutPage.tsx'
      - 'web/src/pages/public/BookPage.tsx'
      - 'web/src/pages/public/HomePage.tsx'
      - 'web/src/pages/public/ServicesPage.tsx'
      - 'web/src/public-site/clinic-info.d.mts'
      - 'web/src/public-site/clinic-info.mjs'
      - 'web/tests/naga-site.test.mjs'
      - 'web/tests/public-site.test.mjs'
      - 'web/src/ops/branch-model.d.mts'
      - 'web/src/ops/branch-model.mjs'
      - 'web/src/ops/read-port.ts'
      - 'web/src/ops/useBranchScope.ts'
      - 'web/tests/ops-branch.test.mjs'
      # Issue58 server-only branch read adapters, typed contract, tests and PG17.
      - 'web/src/lib/staff-branch.ts'
      - 'web/src/staff-branch-read-contract.mjs'
      - 'web/src/staff-branch-read-contract.d.mts'
      - 'web/tests/staff-branch-read-contract.test.mjs'
      - 'supabase/migrations/20261118215500_issue58_staff_branch_read_contract.sql'
      - 'supabase/tests/issue58_staff_branch_queue_fixture.sql'
      - 'supabase/tests/issue58_staff_branch_read_pg17.sql'
      - '.github/workflows/issue58-staff-branch-read-pg17.yml'
      - 'docs/ISSUE58_STAFF_BRANCH_READ.md'
      # Issue78 additive medicine inventory read-only backend candidate.
      - 'supabase/migrations/20261118225000_issue78_inventory_read_only_foundation.sql'
      - 'supabase/tests/issue78_inventory_synthetic_fixture.sql'
      - 'supabase/tests/issue78_inventory_pg17_denials.sql'
      - 'scripts/ci/issue78_concurrent_denials.sh'
      - '.github/workflows/issue78-inventory-pg17.yml'
      - 'docs/ISSUE78_MEDICINE_INVENTORY_READ_ONLY.md'

permissions:
  contents: read

jobs:
  full-tree-postgres17-security:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: full-tree-disposable-only
          POSTGRES_DB: full_tree_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d full_tree_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: full-tree-disposable-only
      PGDATABASE: full_tree_ci
      EXPECTED_BASE_SHA: 63a2b68ee93463f426cafc6bdf468376343001cf
      EXPECTED_FRONTEND_SHA: 2a42489a4b85c46979f9c971474fc74579f673de
      EXPECTED_SECURITY_SHA: 9bc84ef3cde86d6c052c4d40012ffbee9c2391f0
      EXPECTED_STAFF_SHA: 1dfd25f2ffcf5470ed7e0b4a33fcf5013a53a373
      EXPECTED_BACKEND_SHA: 004544eb80ff0b5301745c74c7659a1d8de4fb39
      EXPECTED_PUBLIC_SHA: f32b5fb16f7d16836fdada2d21212ab04cd4bfc6
      EXPECTED_BRANCH_UI_SHA: 1de646b16c4327b67148e1b3ff405942ebb80dda
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EXPECTED_PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require disposable PostgreSQL client and exact-source CI script syntax
        run: |
          command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
          bash -n scripts/ci/full_tree_pg17.sh
      - name: Run actual full-tree six + four + Storage correction, RLS and mandatory policy rejection
        run: bash scripts/ci/full_tree_pg17.sh

  full-tree-node-typescript-vite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: https://lgimhirgvresvbsdugac.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_offline_full_tree_dummy
      VITE_PHASE4_PATIENT_FORM: 'false'
      VITE_PHASE5A_OPS_UI: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Assert patient form and staff Operations feature flags are OFF
        run: |
          test "$VITE_PHASE4_PATIENT_FORM" = 'false'
          test "$VITE_PHASE5A_OPS_UI" = 'false'
      - name: Require reviewed booking source before web build
        run: |
          test "$(git rev-parse HEAD:web/src/pages/AppointmentsPage.tsx)" = "4fb506194b1fa22ef14d795333e4a9bed0e25598"
          test "$(git rev-parse HEAD:web/src/public-site/booking-mode.mjs)" = "3f67451f7ca6c70108ea04067d900078d44e48fe"
          test "$(git rev-parse HEAD:web/tests/owner-booking-view.test.mjs)" = "0782a74fdb33532cd27dba75a395c08e1e2d23bc"
      - name: Run integrated React/booking/queue contract Node tests and TypeScript/Vite build
        working-directory: web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
          node --check tests/integration/smoke.mjs
      - name: Run Grok-accepted hosted security contract OFFLINE only
        env:
          DAWNEY_HOSTED_ACCEPTANCE_MODE: source-only
        run: |
          node --check scripts/hosted-acceptance/guards.mjs
          node --check scripts/hosted-acceptance/acceptance.mjs
          node --check scripts/hosted-acceptance/staging-request-plan.mjs
          node --test scripts/hosted-acceptance/tests/*.test.mjs packages/clinic-auth/tests/smoke-guards.test.mjs
          set +e
          node scripts/hosted-acceptance/acceptance.mjs > "$RUNNER_TEMP/hosted-cli-inert.log" 2>&1
          code=$?
          set -e
          test "$code" -eq 3
          grep -Fx 'HOSTED_ACCEPTANCE_BLOCKED:source_only_no_network_adapter' "$RUNNER_TEMP/hosted-cli-inert.log"
          set +e
          node scripts/hosted-acceptance/staging-request-plan.mjs > "$RUNNER_TEMP/staging-plan-cli-inert.log" 2>&1
          plan_code=$?
          set -e
          test "$plan_code" -eq 3
          grep -Fx 'HOSTED_ACCEPTANCE_BLOCKED:staging_plan_no_network_sender' "$RUNNER_TEMP/staging-plan-cli-inert.log"
      - name: Check scheduling Node contracts and forbid privileged browser credentials
        run: |
          node --test packages/clinic-scheduling/tests/*.test.mjs
          # Match actual high-entropy credential VALUES, not the literal
          # 'service_role' string in a protective client-side key guard.
          # Never dump minified bundle text on a failure.
          if grep -REq '(sb_secret_[A-Za-z0-9_-]{20,}|postgres(ql)?://[^[:space:]]+:[^[:space:]]+@|eyJ[A-Za-z0-9_-]{80,}\.[A-Za-z0-9_-]{40,}\.[A-Za-z0-9_-]{40,})' web/dist; then
            echo 'FAIL: apparent secret credential value in browser bundle'; exit 1
          fi
          test -s web/dist/index.html

  full-tree-real-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VITE_SUPABASE_URL: https://lgimhirgvresvbsdugac.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_offline_full_tree_dummy
      VITE_PHASE4_PATIENT_FORM: 'false'
      VITE_PHASE5A_OPS_UI: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Assert both clinical feature flags are OFF for local Chromium
        run: |
          test "$VITE_PHASE4_PATIENT_FORM" = 'false'
          test "$VITE_PHASE5A_OPS_UI" = 'false'
      - name: Require reviewed booking source before Chromium
        run: |
          test "$(git rev-parse HEAD:web/src/pages/AppointmentsPage.tsx)" = "4fb506194b1fa22ef14d795333e4a9bed0e25598"
          test "$(git rev-parse HEAD:web/tests/owner-booking-view.test.mjs)" = "0782a74fdb33532cd27dba75a395c08e1e2d23bc"
      - name: Locked Vite build from full frontend/backend integration tree
        working-directory: web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Verify Chromium harness and run real browser against LOCAL Vite only
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/browser/tests/*.test.mjs
          node --check scripts/browser/anonymous.mjs
          (cd web && npm run preview -- --host 127.0.0.1 --port 4173 --strictPort) \
            > "$RUNNER_TEMP/full-tree-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:4173/ >/dev/null
          node scripts/browser/anonymous.mjs http://127.0.0.1:4173
