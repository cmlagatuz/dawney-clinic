name: RC2 connected runtime preflight (isolated)
on:
  pull_request:
    paths:
      - 'scripts/connected-runtime/**'
      - '.github/workflows/rc2-connected-runtime.yml'
      - 'docs/RC2_CONNECTED_RUNTIME.md'
permissions:
  contents: read
jobs:
  qualify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ai/astra/rc2-connected-runtime-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing runner dependencies or ephemeral NSS tooling
        run: |
          set -euo pipefail
          if ! command -v certutil >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libnss3-tools
          fi
          command -v google-chrome || command -v chromium
          python3 -m py_compile scripts/connected-runtime/runtime.py scripts/connected-runtime/relay.py
          node --check scripts/connected-runtime/probe.mjs
      - name: Actual isolated runtime preflight only (not connected scenarios)
        run: python3 -u scripts/connected-runtime/runtime.py
