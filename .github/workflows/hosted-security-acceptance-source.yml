name: Hosted security acceptance SOURCE ONLY (no network adapter)

on:
  pull_request:
    paths:
      - 'scripts/hosted-acceptance/**'
      - 'docs/HOSTED_SECURITY_ACCEPTANCE.md'
      - '.github/workflows/hosted-security-acceptance-source.yml'

permissions:
  contents: read

jobs:
  offline-hosted-contracts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source-only harness syntax
        run: |
          node --check scripts/hosted-acceptance/guards.mjs
          node --check scripts/hosted-acceptance/acceptance.mjs
          node --check scripts/hosted-acceptance/tests/acceptance.test.mjs
      - name: Run isolated injection tests and preexisting Auth safety guards (no secrets)
        env:
          DAWNEY_HOSTED_ACCEPTANCE_MODE: source-only
        run: |
          node --test scripts/hosted-acceptance/tests/acceptance.test.mjs packages/clinic-auth/tests/smoke-guards.test.mjs
      - name: Assert harness CLI is inert, even if approval-like flags are set
        shell: bash
        env:
          DAWNEY_ALLOW_SYNTHETIC_WRITES: 'YES'
        run: |
          set -euo pipefail
          set +e
          node scripts/hosted-acceptance/acceptance.mjs > "$RUNNER_TEMP/acceptance-cli.log" 2>&1
          exit_code=$?
          set -e
          test "$exit_code" -eq 3
          grep -Fx 'HOSTED_ACCEPTANCE_BLOCKED:source_only_no_network_adapter' "$RUNNER_TEMP/acceptance-cli.log"
