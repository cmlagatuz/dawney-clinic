name: Phase 5A staff queue real PostgreSQL RLS (isolated)

on:
  pull_request:
    paths:
      - '.github/workflows/phase5a-staff-postgres.yml'
      - 'supabase/tests/phase5a_staff_*.sql'
      - 'web/src/staff-read-contract.mjs'
      - 'web/tests/staff-read-contract.test.mjs'
      - 'docs/PHASE5A_STAFF_READ_CONTRACT.md'
  push:
    branches: [master]
    paths:
      - '.github/workflows/phase5a-staff-postgres.yml'
      - 'supabase/tests/phase5a_staff_*.sql'
      - 'web/src/staff-read-contract.mjs'
      - 'web/tests/staff-read-contract.test.mjs'

permissions:
  contents: read

jobs:
  staff-and-queue-rls-postgres17:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-phase5a-only
          POSTGRES_DB: phase5a_staff_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d phase5a_staff_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: isolated-phase5a-only
      PGDATABASE: phase5a_staff_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Apply actual six Phase2/3 migrations and prove RLS plus queue boundaries
        run: |
          set -euo pipefail
          test "$PGHOST" = '127.0.0.1' && test "$PGDATABASE" = 'phase5a_staff_ci'
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/phase5a_staff_pg17_bootstrap.sql
          for migration in \
            supabase/migrations/20261113070302_phase2_core_data_security.sql \
            supabase/migrations/20261113070834_phase2_index_and_policy_tuning.sql \
            supabase/migrations/20261113074938_phase2_verified_auth_and_staff_bootstrap.sql \
            supabase/migrations/20261113095318_phase3_appointment_lifecycle.sql \
            supabase/migrations/20261113100958_phase3_clinical_storage_policies.sql \
            supabase/migrations/20261113101626_phase3_staff_membership_audit.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/phase5a_staff_pg17_regression.sql

  booking-rpc-to-staff-queue-postgres17:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-phase5a-only
          POSTGRES_DB: phase5a_booking_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d phase5a_booking_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: isolated-phase5a-only
      PGDATABASE: phase5a_booking_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check exact Phase5A staff queue reader and fetch pinned booking/taxonomy commits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object web/src/staff-read-contract.mjs)" = \
            '403cb2fd1710cb80b9b213271ebcb6b8257aeb27'
          git fetch --no-tags --depth=1 origin \
            'refs/pull/40/head:refs/remotes/origin/phase5a-pr40'
          test "$(git rev-parse refs/remotes/origin/phase5a-pr40)" = \
            '7f6b7b4b12c6d5c04a049f5427b77704d560e4f0'
          git fetch --no-tags --depth=1 origin \
            'refs/pull/43/head:refs/remotes/origin/phase5a-pr43'
          test "$(git rev-parse refs/remotes/origin/phase5a-pr43)" = \
            '2749f810a2d5195e974949cb8e23d4495a8b0d11'
          mkdir -p "$RUNNER_TEMP/phase5a-integration"
          git show 'refs/remotes/origin/phase5a-pr40:supabase/migrations/20261114072200_phase4_taxonomy_trigger_chow_chow_guard.sql' \
            > "$RUNNER_TEMP/phase5a-integration/chowchow-guard.sql"
          git show 'refs/remotes/origin/phase5a-pr43:supabase/migrations/20261114090000_phase4_public_booking_contract.sql' \
            > "$RUNNER_TEMP/phase5a-integration/booking.sql"
          test -s "$RUNNER_TEMP/phase5a-integration/chowchow-guard.sql"
          test -s "$RUNNER_TEMP/phase5a-integration/booking.sql"
      - name: Install PostgreSQL client
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Execute real Phase2/3 and Phase4 policies then assert RPC to staff queue
        shell: bash
        run: |
          set -euo pipefail
          test "$PGHOST" = '127.0.0.1' && test "$PGDATABASE" = 'phase5a_booking_ci'
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/phase5a_staff_pg17_bootstrap.sql
          for migration in \
            supabase/migrations/20261113070302_phase2_core_data_security.sql \
            supabase/migrations/20261113070834_phase2_index_and_policy_tuning.sql \
            supabase/migrations/20261113074938_phase2_verified_auth_and_staff_bootstrap.sql \
            supabase/migrations/20261113095318_phase3_appointment_lifecycle.sql \
            supabase/migrations/20261113100958_phase3_clinical_storage_policies.sql \
            supabase/migrations/20261113101626_phase3_staff_membership_audit.sql \
            supabase/migrations/20261113211600_phase4_taxonomy_attachments.sql \
            supabase/migrations/20261113211700_phase4_animal_catalog_seed.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -X -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/phase5a-integration/chowchow-guard.sql"
          psql -X -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/phase5a-integration/booking.sql"
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/phase5a_staff_booking_rpc_queue.sql
