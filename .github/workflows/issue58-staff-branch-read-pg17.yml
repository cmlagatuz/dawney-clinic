name: Issue 58 secure staff branch reads — disposable PostgreSQL 17
# Source-only 14th proposal; NEVER connects to a Supabase project or real Auth.
on:
  pull_request:
    paths:
      - '.github/workflows/issue58-staff-branch-read-pg17.yml'
      - 'supabase/migrations/20261118215500_issue58_staff_branch_read_contract.sql'
      - 'supabase/tests/issue58_staff_branch_queue_fixture.sql'
      - 'supabase/tests/issue58_staff_branch_read_pg17.sql'
      - 'web/src/lib/staff-branch.ts'
      - 'web/src/staff-branch-read-contract.*'
      - 'web/tests/staff-branch-read-contract.test.mjs'
      - 'scripts/ci/full_tree_pg17.sh'
permissions:
  contents: read
jobs:
  staff-branch-read-pg17:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: issue58-disposable-ci-only
          POSTGRES_DB: issue58_branch_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d issue58_branch_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: issue58-disposable-ci-only
      PGDATABASE: issue58_branch_ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact-head and immutable eleven original migration blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          bash -n scripts/ci/full_tree_pg17.sh
          while read -r path sha; do
            test "$(git rev-parse "HEAD:$path")" = "$sha"
            test "$(git hash-object "$path")" = "$sha"
          done <<'ORIGINAL_MIGRATIONS'
          supabase/migrations/20261113070302_phase2_core_data_security.sql cf329269e3f38a5ac320d0b60fe82b6165e218d6
          supabase/migrations/20261113070834_phase2_index_and_policy_tuning.sql d7f8922de9251bb777430ce4163d2ca501b290f5
          supabase/migrations/20261113074938_phase2_verified_auth_and_staff_bootstrap.sql 218b612c15944c811708f4908825d0a969064692
          supabase/migrations/20261113095318_phase3_appointment_lifecycle.sql f12c39c4b75462aa9597d38065c70216e872c478
          supabase/migrations/20261113100958_phase3_clinical_storage_policies.sql b47363bfdc3af3081a2af2f422be44a40c967e54
          supabase/migrations/20261113101626_phase3_staff_membership_audit.sql 0fc85dd437eac7d8d89fe69025df917ab79d3e0e
          supabase/migrations/20261113211600_phase4_taxonomy_attachments.sql 4296a5dcf84324cd83eea226e6054b0cd4f56658
          supabase/migrations/20261113211700_phase4_animal_catalog_seed.sql cc03606d3d47b0d573f431a1a1161ba243a314d3
          supabase/migrations/20261114072200_phase4_taxonomy_trigger_chow_chow_guard.sql 028cbdcfb96e15d297a9458322e1108c46a8b035
          supabase/migrations/20261114090000_phase4_public_booking_contract.sql 929f327141d9e5bb2be220d5685c6ce3f28c253c
          supabase/migrations/20261116002500_phase3_storage_outer_object_path_rls_fix.sql 4d78cb2aef1104379d6fd29797705a6188c4c6dc
          ORIGINAL_MIGRATIONS
          echo 'PASS: unchanged 11 approved Phase2-4+Storage migration blobs'
      - name: Prepare disposable PostgreSQL17 client
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Replay original eleven unchanged migrations in isolated PG17
        shell: bash
        run: |
          set -euo pipefail
          pg(){ psql -X -v ON_ERROR_STOP=1 -q -f "$1"; }
          pg supabase/tests/phase5a_staff_pg17_bootstrap.sql
          pg supabase/tests/phase4_combined_provider_upgrade.sql
          for f in \
            20261113070302_phase2_core_data_security.sql \
            20261113070834_phase2_index_and_policy_tuning.sql \
            20261113074938_phase2_verified_auth_and_staff_bootstrap.sql \
            20261113095318_phase3_appointment_lifecycle.sql \
            20261113100958_phase3_clinical_storage_policies.sql \
            20261113101626_phase3_staff_membership_audit.sql \
            20261113211600_phase4_taxonomy_attachments.sql \
            20261113211700_phase4_animal_catalog_seed.sql \
            20261114072200_phase4_taxonomy_trigger_chow_chow_guard.sql \
            20261114090000_phase4_public_booking_contract.sql \
            20261116002500_phase3_storage_outer_object_path_rls_fix.sql; do
              pg "supabase/migrations/$f"
          done
          pg supabase/tests/phase3_storage_outer_path_synthetic_records.sql
          psql -X -v ON_ERROR_STOP=1 -q <<'BEFORE'
          create table clinic_ci.issue77_original_pets as select id,to_jsonb(p) old_row from public.pets p;
          create table clinic_ci.issue77_original_appointments as select id,to_jsonb(a) old_row from public.appointments a;
          BEFORE
          echo 'PASS: original schema and synthetic historical snapshots loaded in isolated PG17 only'
      - name: Replay original 12th/13th and test additive 14th staff branch read under real PostgreSQL17 RLS
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261117233500_issue77_four_branch_foundation.sql
          # Every original source SHA is checked by the unchanged eleven-hash ledger above.
          test "$(git hash-object supabase/migrations/20261117233500_issue77_four_branch_foundation.sql)" = "4732b815cff45850d2f01cdeb93c527dac0e22a0"
          test "$(git hash-object supabase/migrations/20261118203500_issue51_branch_booking_security.sql)" = "f58ca0e0bcb36d3a320060db7bf9bbeffe7f35f3"
          test "$(git hash-object supabase/migrations/20261118215500_issue58_staff_branch_read_contract.sql)" = "c889477348d9505d54f54b1d08532c2f648992a9"
          test "$(git hash-object supabase/tests/issue58_staff_branch_queue_fixture.sql)" = "627c704a311cfe92c3c805bb248a2ed90c1987dc"
          test "$(git hash-object supabase/tests/issue58_staff_branch_read_pg17.sql)" = "777d66a7fde398e9336c707e0cd3561dfbbfa53c"
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/tests/issue77_four_branch_pg17_denials.sql
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/tests/issue58_staff_branch_queue_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261118203500_issue51_branch_booking_security.sql
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261118215500_issue58_staff_branch_read_contract.sql
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/tests/issue58_staff_branch_read_pg17.sql
          echo 'PASS: ISSUE58 real PG17 Naga/Cavite RLS, branch counts, 251 same-day queue, revocation and UNKNOWN history'
